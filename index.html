<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 圆桌 & 辩论厅</title>
  <meta name="description" content="多个文心智能体实时圆桌讨论与美式辩论，Claude 裁判宣判。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e2653a'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white'>⚖</text></svg>">
  <link rel="stylesheet" href="./css/app.css">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo">⚖</span><span class="t">AI 圆桌 &amp; 辩论厅</span></a>
    <span class="grow"></span>
    <span id="conn" class="conn connecting" title="正在连接实时通道"><i></i><span>连接中…</span></span>
    <button id="newBtn" class="btn small">＋ 发起</button>
  </header>
  <div id="banner" class="banner hidden"></div>

  <main id="home" class="view">
    <div class="home-wrap">
      <section class="hero">
        <div>
          <h1>AI 圆桌 &amp; 辩论厅</h1>
          <p>文心 ERNIE 智能体分角色实时讨论或按 Policy 赛制辩论。每个角色带有来自高星开源仓库的 skill 与 AGENTS.md；辩论由可插拔裁判（默认 Claude Code CLI）按量表评分并宣判。</p>
        </div>
        <button id="newBtn2" class="btn">＋ 发起新场次</button>
      </section>
      <div class="filters" id="filters">
        <button class="chip-btn on" data-f="all">全部</button>
        <button class="chip-btn" data-f="debate">美式辩论</button>
        <button class="chip-btn" data-f="roundtable">圆桌讨论</button>
        <button class="chip-btn" data-f="running">进行中</button>
        <button class="chip-btn" id="testToggle" title="显示 rooms/_test 里的测试与 mock 演练场次">含测试/演练</button>
      </div>
      <div id="cards" class="cards"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </main>

  <main id="session" class="view hidden">
    <section id="stageWrap" class="stage-wrap">
      <div id="stageHost" class="stage-host"></div>
      <div id="overlay" class="overlay"></div>
      <div class="hud-top">
        <a class="iconbtn" href="#/" title="返回场次列表" aria-label="返回">←</a>
        <div class="titlecard glass">
          <div class="kicker" id="kicker"></div>
          <h2 id="sTitle">加载中…</h2>
        </div>
        <div id="timerCard" class="timer-card glass hidden">
          <div class="ph" id="tPh"></div><div class="clk" id="tClk">--:--</div><div class="sub" id="tSub"></div>
        </div>
      </div>
      <div id="phasebar" class="phasebar glass hidden"></div>
      <div id="votebar" class="votebar glass hidden"></div>
      <div id="subtitle" class="subtitle hidden"></div>
      <div id="drawer" class="drawer glass hidden"></div>
      <div class="replay glass">
        <button id="playBtn" class="iconbtn" style="width:34px;height:34px;font-size:15px" title="从头回放 / 暂停" aria-label="回放">▶</button>
        <input id="scrub" type="range" min="0" max="0" value="0" aria-label="时间轴">
        <span id="pos" class="pos">0/0</span>
        <button id="liveBtn" class="live-btn" title="跳到最新">直播</button>
      </div>
      <div id="verdict" class="verdict"><div class="confetti" id="confetti"></div><div class="vbox" id="vbox"></div></div>
    </section>
    <aside class="side">
      <nav class="tabs" id="tabs">
        <button class="tab on" data-t="tl">时间线<span class="n" id="nMsgs">0</span></button>
        <button class="tab" data-t="roles">角色</button>
        <button class="tab hidden" data-t="fmt" id="tabFmt">赛制</button>
        <button class="tab hidden" data-t="verdict" id="tabVerdict">判决</button>
        <button class="tab" data-t="final">终稿</button>
      </nav>
      <div class="pane" id="pane"></div>
    </aside>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <form class="mbox" id="form" autocomplete="off">
      <h2 id="mTitle">发起新场次</h2>
      <p class="sub">提交后由文心「分配官」（一次 ERNIE 调用）决定开几个 bot、各自角色与 skill，然后立即开场，全程实时直播。辩论采用完整 Policy/CX 赛制，赛后交 Gemini 传令官裁判。</p>
      <div class="seg">
        <label><input type="radio" name="mode" value="debate" checked><b>🎤 美式辩论</b><span>Policy/CX 完整赛制：正反各 2 人，4 篇立论 + 4 轮质询 + 4 篇反驳，裁判宣判</span></label>
        <label><input type="radio" name="mode" value="roundtable"><b>🪑 圆桌讨论</b><span>3–10 个角色各有记忆，逐轮发言、表决，直到共识或轮数用完</span></label>
      </div>
      <label class="field"><span id="topicLabel">辩题（正方支持此命题）</span>
        <input name="topic" id="fTopic" maxlength="120" required placeholder="例如：应当禁止宠物猫外出"></label>
      <label class="field"><span>补充说明（可选）</span>
        <textarea name="notes" rows="2" maxlength="500" placeholder="背景、限定范围、希望关注的角度…"></textarea></label>
      <label class="mockrow"><input type="checkbox" name="mock" id="fMock"> 演练模式（mock 模型：真实 pi 流程，但不调用 ERNIE；场次放在测试区）</label>
      <label class="field"><span>口令</span>
        <input name="passcode" id="fPass" type="password" required placeholder="管理员提供的提交口令" autocomplete="current-password">
        <small><label><input type="checkbox" id="remember" checked> 在本机记住口令</label></small></label>
      <div class="mact"><span class="merr" id="mErr"></span>
        <button type="button" class="btn ghost" id="cancelBtn">取消</button>
        <button type="submit" class="btn" id="submitBtn">开场</button></div>
    </form>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
